[project]
name = "migyeol-backend"
version = "0.1.0"
description = "미결(未結) — 뉴스 애프터케어 서비스 백엔드"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "anthropic>=1.0",
  "numpy>=1.26",
  "pyyaml>=6",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
