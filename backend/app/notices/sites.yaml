# 공공기관 공식 게시판 등록부 (v2 §3) — 트랙 C
#
# - orgs     : 이 게시판이 맡는 기관. rules/orgs.canonical_org() 키와 같은 값 (서울시, 부산시, 경기도, 충남, 국토교통부 …)
# - domain   : 요청 허용 도메인에 더해진다. 뉴스 도메인은 등록할 수 없다(로드 시 거부)
# - list_url : 게시판 "목록" 페이지. {page} = 1부터. 최신 글이 먼저 나오는 기본 정렬
# - search_url: 게시판 자체 제목 검색(결과도 같은 목록 형식). 있으면 사건 시설명·핵심어로 검색 목록을 읽는다
# - item / title / link / date / snippet : 목록 항목과 그 안의 CSS 선택자. date 가 없으면 항목 글자에서 날짜를 찾는다
# - body     : 상세 페이지 본문 선택자 — 제목이 사건과 매칭된 항목만, 첫 300자
# - link_id_regex + link_template : javascript: 링크에서 글 번호를 뽑아 상세 URL 을 만든다
# - verified : scripts/run_notices.py --check-sites 로 실제 목록 파싱을 확인한 기록 (docs/NOTICES.md 에 같은 표)
#
# robots.txt 가 목록 경로를 막는 게시판(세종시·제주도·대구시 info.daegu·충북)은 등록하지 않는다 — docs/NOTICES.md 참고.

sites:
  - key: seoul-press
    name: 서울특별시 보도자료
    orgs: [서울시]
    domain: seoul.go.kr
    list_url: "https://www.seoul.go.kr/news/news_report.do?bbsNo=158&curPage={page}"
    search_url: "https://www.seoul.go.kr/news/news_report.do?bbsNo=158&srchKey=sj&srchText={query}&curPage={page}"
    item: "table.sib-lst-type-basic tbody tr"
    title: "td.sib-lst-type-basic-subject a"
    link: "td.sib-lst-type-basic-subject a"
    date: "td:last-child"
    link_id_regex: "fnTbbsView\\('(\\d+)'\\)"
    link_template: "https://www.seoul.go.kr/news/news_report.do?bbsNo=158&nttNo={id}"
    body: "div.sib-viw-type-basic-cont, div#viewTable .view-cont, div#viewTable"
    note: "robots.txt 가 / 를 막고 /news 를 허용 (RFC 9309 최장 일치로 허용)"
    verified: {date: "2026-10-22", page1_items: 10, page2_items: 10, search: true}

  - key: busan-press
    name: 부산광역시 보도자료
    orgs: [부산시]
