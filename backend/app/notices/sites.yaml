    search_url: "https://www.busan.go.kr/nbtnewsBU?srchKey=sj&srchText={query}&curPage={page}"
    item: "div.boardTextGallery ul > li"
    title: "div.bTitle"
    link: "a.item"
    date: "div.writer"
    snippet: "div.tgTxt div.txtL:not(.writer)"
    body: "div.boardView div.form-group:nth-of-type(1), div.boardView"
    note: "robots.txt 가 401 — RFC 9309 2.3.1.3 에 따라 제한 없음으로 본다"
    verified: {date: "2026-10-22", page1_items: 12, page2_items: 12, search: true}

